name: Learning pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: learning-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: python -m pip install -r website/requirements.txt
      - run: python scripts/bilingual.py check
      - run: python -m unittest discover -s scripts -p 'test_site.py' -v
      - name: Refresh both upstream histories
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/site.py refresh-upstream
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build project-path preview
        if: github.event_name == 'pull_request'
        run: python scripts/site.py build --base /pstack/ --output "$RUNNER_TEMP/pstack-site"
      - name: Build deployment
        if: github.event_name != 'pull_request'
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: python scripts/site.py build --base "${PAGES_BASE:-/}/" --output "$RUNNER_TEMP/pstack-site"
      - run: python scripts/site.py check --output "$RUNNER_TEMP/pstack-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pstack-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
